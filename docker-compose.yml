services:
  api:
    build:
      context: ./apps/api
    ports:
      - "8080:8080"
    # Runtime configuration: Compose reads apps/api/.env when the container starts and passes its values
    # as environment variables. The file is never copied into the image (apps/api/.dockerignore excludes it).
    # Required in that file: AI_API_KEY, AI_MODEL, AI_TIMEOUT_SECONDS (no defaults: the API exits at startup
    # with a clear message if any is missing or invalid) and CORS_ALLOWED_ORIGINS for a browser frontend.
    # No `environment:` entries here on purpose: they would override env_file, e.g. with empty values.
    env_file:
      - ./apps/api/.env
